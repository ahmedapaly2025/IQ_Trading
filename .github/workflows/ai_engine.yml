name: IQ AI Master Engine Runner

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run_quad_ai_inference:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: جلب الكود والموديلات (Checkout Repository)
        uses: actions/checkout@v4

      - name: إعداد بيئة بايثون (Python 3.10)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: تثبيت مكتبات الذكاء الاصطناعي
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas scikit-learn scipy joblib requests
          pip install iqoptionapi || true

      - name: تنفيذ دورة الذكاء الاصطناعي الحقيقية
        env:
          IQ_EMAIL: ${{ secrets.IQ_EMAIL }}
          IQ_PASSWORD: ${{ secrets.IQ_PASSWORD }}
          IQ_SSID: ${{ secrets.IQ_SSID }}
          GAS_API_URL: ${{ secrets.GAS_API_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python cloud_ai_engine.py
