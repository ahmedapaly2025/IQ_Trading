name: IQ AI Analyzer Cron Worker

on:
  schedule:
    # يعمل تلقائياً كل 15 دقيقة (يمكن تغييرها، الحد الأدنى المسموح به في جيت هاب هو كل 5 دقائق)
    - cron: '*/15 * * * *'
  workflow_dispatch: # يتيح لك زر "Run workflow" لتشغيله يدوياً في أي وقت للاختبار

jobs:
  analyze_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: فحص الكود (Checkout Code)
        uses: actions/checkout@v4

      - name: إعداد بيئة بايثون (Setup Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: تثبيت المكتبات (Install Dependencies)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: تشغيل محرك التحليل وإرسال البيانات
        env:
          GAS_API_URL: ${{ secrets.GAS_API_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot_worker.py
